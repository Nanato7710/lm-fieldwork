[project]
name = "lm-fieldwork"
version = "0.1.0"
description = "Read. Trace. Test. Explain."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<3",
  "tokenizers>=0.21,<1",
  "transformers>=4.52,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_fieldwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
